[defaults]
inventory = inventories/production
roles_path = roles
# Пароль Vault не задан здесь, чтобы линт и syntax-check работали без него.
# Makefile и CI передают ANSIBLE_VAULT_PASSWORD_FILE=vault-pass.sh (читает $ANSIBLE_VAULT_PASSWORD или .vault_pass)
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False
forks = 10
timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
