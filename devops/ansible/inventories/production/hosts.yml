# Группы хостов:
#   backend     — Medusa (server + worker), PostgreSQL, Redis, RabbitMQ; ровно один хост (первый в группе)
#   storefronts — фронты магазинов сети (`<магазин>-frontend`)
# Один хост может состоять в обеих группах (так сейчас) — или фронты живут на своих хостах: роли не меняются,
# фронт на другом хосте ходит в API по https://api.<домен сети> вместо внутренней docker-сети.
# На каждом хосте — свой traefik. ansible_user — пользователь деплоя, его создаёт `make infra-bootstrap`.
all:
  children:
    backend:
      hosts:
        snowaa-1:
          ansible_host: 203.0.113.10
          ansible_user: deploy
    storefronts:
      hosts:
        snowaa-1: {}
