traefik_image: traefik:v3.7
# Доступ traefik к Docker API только на чтение контейнеров и событий (без docker.sock в самом traefik)
traefik_socket_proxy_image: tecnativa/docker-socket-proxy:v0.5.0
traefik_dir: "{{ project_dir }}/traefik"
traefik_log_level: INFO

traefik_acme_email: "{{ acme_email }}"
# true — тестовый CA Let's Encrypt: без лимитов выдачи, но браузеры сертификату не доверяют
traefik_acme_staging: false

traefik_dashboard_enabled: true
# Хостов несколько (backend и storefronts раздельно) — у каждого свой traefik: переопределите в host_vars
traefik_dashboard_domain: "traefik.{{ network_domain }}"
traefik_dashboard_user: admin
traefik_dashboard_password: "{{ vault_traefik_dashboard_password }}"

traefik_hsts_seconds: 31536000
traefik_hsts_include_subdomains: true
# true — после проверки, что все поддомены работают по HTTPS; затем домен подаётся на https://hstspreload.org
traefik_hsts_preload: false

# Ограничение запросов с одного IP (всё, что идёт через traefik)
traefik_rate_limit_average: 100
traefik_rate_limit_burst: 200
# Вход и регистрация (Medusa /auth/*, POST /login и /register витрины): попыток в минуту с одного IP
traefik_auth_rate_limit_per_minute: 10

# CSP Medusa: API отдаёт только JSON; админке (/app) нужны свои скрипты, инлайн-стили и картинки с https
traefik_api_csp: "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
traefik_admin_csp: >-
  default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:;
  font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self';
  form-action 'self'; frame-ancestors 'none'
# IP/подсети CDN или балансировщика перед traefik, которым доверять X-Forwarded-* (Cloudflare, DDoS-Guard…)
traefik_trusted_ips: []
