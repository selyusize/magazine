docker_apt_url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
docker_apt_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Зеркала Docker Hub — если Hub недоступен с сервера или упирается в лимиты (например https://mirror.gcr.io)
docker_registry_mirrors: []
docker_log_max_size: 20m
docker_log_max_file: 5
# Еженедельно удалять неиспользуемые образы старше этого срока (старые теги остаются в реестре для отката)
docker_image_prune_until: 168h
