# Источники обновлений — из стандартного 50unattended-upgrades: только security-обновления дистрибутива
- name: Включить автоматические обновления безопасности
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Каталог настроек journald
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ограничить размер системного журнала
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/90-size.conf
    owner: root
    group: root
    mode: "0644"
  notify: Перезапустить journald
