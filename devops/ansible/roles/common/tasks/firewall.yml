# Docker публикует порты в обход UFW, поэтому наружу публикуются только 80/443 (traefik),
# БД и брокер доступны лишь во внутренних docker-сетях.
- name: Разрешить SSH
  community.general.ufw:
    rule: allow
    port: "{{ common_ssh_port | string }}"
    proto: tcp

- name: Разрешить HTTP/HTTPS и HTTP/3
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: "80", proto: tcp }
    - { port: "443", proto: tcp }
    - { port: "443", proto: udp }

- name: Включить UFW с запретом входящих по умолчанию
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Настроить fail2ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Перезапустить fail2ban

- name: Запустить fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true
