# Бэкап сейчас (тот же скрипт, что ночной cron): make db-backup [DOWNLOAD=1 — ещё и скачать в devops/dumps]
- name: Дамп PostgreSQL
  ansible.builtin.command:
    cmd: "{{ project_dir }}/bin/backup-postgres"
  register: postgres_backup
  changed_when: true

- name: Файл бэкапа
  ansible.builtin.set_fact:
    postgres_backup_file: "{{ postgres_backup.stdout_lines | select('match', '^OK: ') | first | regex_replace('^OK: ', '') }}"

- name: Скачать бэкап
  ansible.builtin.fetch:
    src: "{{ postgres_backup_file }}"
    dest: "{{ playbook_dir }}/../../dumps/{{ postgres_backup_file | basename }}"
    flat: true
  when: postgres_backup_download | bool

- name: Готово
  ansible.builtin.debug:
    msg:
      - "Бэкап на сервере: {{ postgres_backup_file | basename }}"
      - "{{ ('Локально: devops/dumps/' ~ (postgres_backup_file | basename)) if postgres_backup_download | bool else '' }}"
      - "Восстановить: make db-restore FILE={{ postgres_backup_file | basename }}"
