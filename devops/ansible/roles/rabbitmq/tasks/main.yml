- name: Проверить секреты rabbitmq
  ansible.builtin.assert:
    that: vault_rabbitmq_password is defined
    fail_msg: Нет vault_rabbitmq_password — создайте секреты (make infra-vault)
    quiet: true

- name: Каталог rabbitmq
  ansible.builtin.file:
    path: "{{ rabbitmq_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Compose rabbitmq
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ rabbitmq_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Конфигурация rabbitmq
  ansible.builtin.template:
    src: rabbitmq.conf.j2
    dest: "{{ rabbitmq_dir }}/rabbitmq.conf"
    owner: root
    group: root
    mode: "0644"
  register: rabbitmq_config

- name: Переменные окружения rabbitmq
  ansible.builtin.template:
    src: rabbitmq.env.j2
    dest: "{{ rabbitmq_dir }}/rabbitmq.env"
    owner: root
    group: root
    mode: "0600"
  diff: false

- name: Запустить rabbitmq
  community.docker.docker_compose_v2:
    project_src: "{{ rabbitmq_dir }}"
    state: present
    pull: missing
    remove_orphans: true
    recreate: "{{ 'always' if rabbitmq_config is changed else 'auto' }}"
    wait: true
    wait_timeout: 180
