# Publishable key магазина storefront_slug: сид и кнопка «Создать магазин» называют ключ «Витрина <slug>».
# Подключается и из playbooks/frontend-build-args.yml: ключ вшивается в бандл фронта при сборке.
- name: Найти publishable key в БД
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      docker exec
      {{ postgres_host }}
      psql -U {{ postgres_user | quote }} -d {{ postgres_db | quote }} -tAc
      "select token from api_key where type = 'publishable' and revoked_at is null
      and title = 'Витрина {{ storefront_slug }}' order by created_at desc limit 1"
    executable: /bin/bash
  register: backend_publishable_key_query
  changed_when: false
  # Только чтение — выполняется и в --check
  check_mode: false

- name: Запомнить publishable key
  ansible.builtin.set_fact:
    backend_publishable_key: "{{ backend_publishable_key_query.stdout | trim }}"
