# Управляется Ansible (roles/backend). Отдаёт загрузки Medusa (volume uploads) мимо Node.
# TLS, сжатие и заголовки безопасности — на traefik, сюда приходит только /static/*.
server {
    listen 8080;
    server_tokens off;
    root /srv;

    # Имя файла уникально (file-local добавляет метку времени, копии srcset — производные от него),
    # поэтому содержимое по адресу не меняется — кэшируем навсегда
    location /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Приватные файлы (экспорт CSV из админки и т.п.) file-local кладёт сюда же с префиксом private-:
        # ссылки на них админка получает как presigned URL. Не кэшируем и не индексируем
        location ~ "^/static/(.+/)?private-" {
            try_files $uri =404;
            add_header Cache-Control "private, no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
