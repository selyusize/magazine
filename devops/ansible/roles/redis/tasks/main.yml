- name: Проверить секреты redis
  ansible.builtin.assert:
    that: vault_redis_password is defined
    fail_msg: Нет vault_redis_password — создайте секреты (make infra-vault)
    quiet: true

- name: Каталог redis
  ansible.builtin.file:
    path: "{{ redis_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Compose redis
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ redis_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0640"

# .env — переменные для подстановки в compose.yml (пароль не хранится в самом compose-файле)
- name: Пароль redis
  ansible.builtin.template:
    src: env.j2
    dest: "{{ redis_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  diff: false

- name: Запустить redis
  community.docker.docker_compose_v2:
    project_src: "{{ redis_dir }}"
    state: present
    pull: missing
    remove_orphans: true
    wait: true
    wait_timeout: 60
