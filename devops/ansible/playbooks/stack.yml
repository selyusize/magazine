# Управление уже развёрнутым стеком: make prod-up | prod-down | prod-restart | prod-status [SERVICES=backend,frontend]
#   up      — поднять (в порядке зависимостей); backend и frontend — через compose-rollout, с именами snowaa-backend,
#             olisa-frontend
#   down    — остановить и удалить контейнеры (в обратном порядке); данные в volume сохраняются
#   restart — перезапустить контейнеры (короткий простой; для обновления без простоя — make deploy)
#   status  — только показать контейнеры и их здоровье
# Сервисы: traefik, postgres, redis, rabbitmq, backend (хосты группы backend), frontend (группы storefronts).
- name: Стек на сервере
  hosts: backend:storefronts
  become: true
  gather_facts: false
  vars:
    stack_known: [traefik, postgres, redis, rabbitmq, backend, frontend]
    stack_all: >-
      {{ ['traefik']
      + ((['postgres', 'redis'] + (['rabbitmq'] if rabbitmq_enabled | bool else []) + ['backend'])
         if inventory_hostname in groups['backend'] else [])
      + (['frontend'] if inventory_hostname in groups['storefronts'] else []) }}
    stack_selected: "{{ (services | default('')).split(',') | map('trim') | select | list }}"
    stack_order: "{{ stack_all | select('in', stack_selected or stack_all) | list }}"
    stack_rollout:
      backend: "{{ backend_host }}"
      frontend: "{{ frontend_container }}"
  tasks:
    - name: Проверить параметры
      ansible.builtin.assert:
        that:
          - stack_action | default('') in ['up', 'down', 'restart', 'status']
          - stack_selected | difference(stack_known) | length == 0
        fail_msg: "stack_action: up | down | restart | status; services — из {{ stack_known | join(', ') }}"
        quiet: true

    - name: Поднять сервисы
      ansible.builtin.command:
        cmd: >-
          {% if item in stack_rollout %}{{ project_dir }}/bin/compose-rollout {{ project_dir }}/{{ item }} {{ item }} 300 {{ stack_rollout[item] }}
          {% else %}docker compose up -d --wait --remove-orphans{% endif %}
        chdir: "{{ project_dir }}/{{ item }}"
      loop: "{{ stack_order }}"
      register: stack_up
      changed_when: "'unchanged' not in stack_up.stdout"
      when: stack_action == 'up'

    # Worker не обновляется rollout-скриптом
    - name: Поднять worker
      ansible.builtin.command:
        cmd: docker compose up -d --no-deps backend-worker
        chdir: "{{ project_dir }}/backend"
      changed_when: true
      when: stack_action == 'up' and 'backend' in stack_order

    - name: Остановить сервисы
      ansible.builtin.command:
        cmd: docker compose down
        chdir: "{{ project_dir }}/{{ item }}"
      loop: "{{ stack_order | reverse | list }}"
      changed_when: true
      when: stack_action == 'down'

    - name: Перезапустить сервисы
      ansible.builtin.command:
        cmd: docker compose restart
        chdir: "{{ project_dir }}/{{ item }}"
      loop: "{{ stack_order }}"
      changed_when: true
      when: stack_action == 'restart'

    - name: Состояние контейнеров
      ansible.builtin.command:
        cmd: >-
          docker ps -a --filter name=^{{ project_name }}- {% if inventory_hostname in groups['storefronts'] %}--filter name=-frontend{% endif %}
          --format '{{ '{{' }}.Names{{ '}}' }}  {{ '{{' }}.Status{{ '}}' }}  {{ '{{' }}.Image{{ '}}' }}'
      register: stack_ps
      changed_when: false
      check_mode: false

    - name: Показать состояние
      ansible.builtin.debug:
        msg: "{{ stack_ps.stdout_lines }}"
