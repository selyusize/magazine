# Хранилища и брокер: PostgreSQL + Redis (Medusa), RabbitMQ (rabbitmq_enabled).
# Отдельный сервис: make infra-data TAGS=rabbitmq
- name: Хранилища и брокер сообщений
  hosts: shop
  become: true
  roles:
    - role: postgres
      tags: [postgres]
    - role: redis
      tags: [redis]
    - role: rabbitmq
      tags: [rabbitmq]
      when: rabbitmq_enabled | bool
