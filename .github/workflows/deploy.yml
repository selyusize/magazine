# CI → образ backend → деплой backend (миграции) → образ витрины → деплой витрины.
# Витрина собирается после деплоя backend: в её бандл вшиваются адрес API и publishable key,
# который создаётся первой миграцией (playbooks/frontend-build-args.yml).
#
# Включение: переменная репозитория DEPLOY_ENABLED=true и окружение production с секретами
# SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS, ANSIBLE_VAULT_PASSWORD (см. devops/ansible/README.md).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    name: Имена образов
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.names.outputs.prefix }}
      tag: ${{ steps.names.outputs.tag }}
    steps:
      - id: names
        # GHCR принимает только нижний регистр
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-backend:
    name: Образ backend
    needs: [ci, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: devops/backend.Dockerfile
          push: true
          tags: |
            ${{ needs.images.outputs.prefix }}-backend:${{ needs.images.outputs.tag }}
            ${{ needs.images.outputs.prefix }}-backend:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: Деплой
    needs: [images, build-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ${{ needs.images.outputs.prefix }}
      IMAGE_TAG: ${{ needs.images.outputs.tag }}
      ANSIBLE_VAULT_PASSWORD_FILE: vault-pass.sh
      ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      # Сервер тянет образы из GHCR токеном этого запуска (roles/docker/tasks/registry_login.yml)
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: devops/ansible
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ansible-setup
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      # Та же цель, что ручной деплой с машины разработчика
      - name: Backend — миграции и выкат без простоя
        run: make -C ../.. deploy-backend TAG="$IMAGE_TAG" IMAGE_PREFIX="$IMAGE_PREFIX"

      - name: Build-args витрины
        id: build-args
        run: |
          ansible-playbook playbooks/frontend-build-args.yml -e build_args_file="$RUNNER_TEMP/frontend.args"
          {
            echo 'list<<EOF'
            cat "$RUNNER_TEMP/frontend.args"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Образ витрины
        uses: docker/build-push-action@v7
        with:
          context: .
          file: devops/frontend.Dockerfile
          push: true
          build-args: ${{ steps.build-args.outputs.list }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Frontend — выкат без простоя
        run: make -C ../.. deploy-frontend TAG="$IMAGE_TAG" IMAGE_PREFIX="$IMAGE_PREFIX"
